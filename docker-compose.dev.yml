# Dev override: hot reload for API and web, DB exposed on localhost:5432.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  db:
    ports: ["5432:5432"]

  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes: ["./backend/app:/app/app"]
    ports: ["8000:8000"]

  worker:
    volumes: ["./backend/app:/app/app"]

  web:
    build:
      context: ./frontend
      target: deps
    command: ["npx", "next", "dev", "-p", "3000"]
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      start_period: 40s
