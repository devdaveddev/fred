[project]
name = "fred-api"
version = "0.1.0"
description = "Revenue intelligence API: deterministic metrics with receipts + seeded scenario engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "numpy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "scikit-learn>=1.9.1",
    "pandas>=3.1.1",
    "pyyaml>=6.0.3",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "cryptography>=50.0.2",
    "python-multipart>=0.0.33",
    "crewai[anthropic]>=1.15",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# B008: FastAPI's Depends() in defaults is the framework idiom. BLE001: health probe + warm-up must never crash.
ignore = ["B008", "BLE001", "C408"]
